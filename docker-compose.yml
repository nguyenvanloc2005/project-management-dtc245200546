version: "3.8"

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

services:
  db:
    image: postgres:15-alpine
    container_name: pm_postgres
    restart: always
    environment:
      POSTGRES_USER: pm_user
      POSTGRES_PASSWORD: StrongPassword123!
      POSTGRES_DB: pm_db
    networks:
      - backend_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domain.com
      PGADMIN_DEFAULT_PASSWORD: StrongAdminPassword123!
    ports:
      - "5050:80"
    networks:
      - frontend_net
      - backend_net

  web_app:
    build: ./app
    container_name: pm_web_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: pm_user
      DB_PASSWORD: StrongPassword123!
      DB_NAME: pm_db
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: pm_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
    depends_on:
      - web_app

  # --- THÊM CÁC DỊCH VỤ GIÁM SÁT MỚI VÀO ĐÂY ---
  prometheus:
    image: prom/prometheus
    container_name: pm_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - frontend_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: pm_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - frontend_net

  grafana:
    image: grafana/grafana
    container_name: pm_grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - frontend_net
