version: "3.8"

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true # Network Isolation cho DB

services:
  # Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: pm_postgres
    restart: always
    environment:
      POSTGRES_USER: pm_user
      POSTGRES_PASSWORD: StrongPassword123!
      POSTGRES_DB: pm_db
    networks:
      - backend_net

  # Quản lý Database: pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: pm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domain.com
      PGADMIN_DEFAULT_PASSWORD: StrongAdminPassword123!
    ports:
      - "5050:80"
    networks:
      - frontend_net
      - backend_net

  # Web App Node.js
  web_app:
    build: ./app
    container_name: pm_web_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: pm_user
      DB_PASSWORD: StrongPassword123!
      DB_NAME: pm_db
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - db

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pm_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
    depends_on:
      - web_app

  # Prometheus
  prometheus:
    image: prom/prometheus
    container_name: pm_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - frontend_net

  # cAdvisor (Giám sát Container)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: pm_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - frontend_net

  # Grafana
  grafana:
    image: grafana/grafana
    container_name: pm_grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - frontend_net

  # Loki
  loki:
    image: grafana/loki:2.9.0
    container_name: pm_loki
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - frontend_net

  # Promtail
  promtail:
    image: grafana/promtail:2.9.0
    container_name: pm_promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - frontend_net
